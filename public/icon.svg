<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020611" />
      <stop offset="50%" stop-color="#060D1A" />
      <stop offset="100%" stop-color="#081226" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#00F0FF" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Radar Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield Core -->
  <g filter="url(#cyan-glow)">
    <path d="M256 90 L380 145 C380 260 330 355 256 415 C182 355 132 260 132 145 Z" fill="url(#shield-grad)" stroke="#ffffff" stroke-width="6" />
    <path d="M256 120 L350 162 C350 250 310 325 256 375 C202 325 162 250 162 162 Z" fill="#040914" opacity="0.85" />
    <!-- Center Emblem -->
    <path d="M256 150 L256 345 C295 305 325 245 325 178 Z" fill="#00F0FF" />
    <path d="M256 150 L187 178 C187 245 217 305 256 345 Z" fill="#06B6D4" opacity="0.6" />
  </g>

  <!-- Checkmark / Security Ticks -->
  <circle cx="256" cy="415" r="12" fill="#00E676" />
  <path d="M250 415 L254 419 L263 410" stroke="#020611" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
